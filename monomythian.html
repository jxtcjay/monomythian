<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>THE MONOMYTHIAN</title>
<style>
:root{
  --bg:#ffffff;
  --ink:#0e0e0e;
  --dim:#8c8c8c;
  --faint:#dcdcdc;
  --line:#ececec;
  --alert:#a8261c;
  --inv-bg:#0e0e0e;
  --inv-ink:#ffffff;
  --mono: ui-monospace, "SF Mono", "Cascadia Code", "JetBrains Mono", "Roboto Mono", Menlo, Consolas, monospace;
  --w: 780px;
}
*{box-sizing:border-box;}
html,body{height:100%;margin:0;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--mono);
  font-size:12.5px;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
  -webkit-text-size-adjust:100%;
  text-size-adjust:100%;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}
/* track the visual viewport so the on-screen keyboard doesn't hide the composer */
@supports (height:100dvh){
  html,body{height:100dvh;}
}
.wrap{width:100%;max-width:var(--w);margin:0 auto;padding:0 18px;display:flex;flex-direction:column;height:100%;}

/* header */
header{display:flex;align-items:baseline;gap:12px;padding:14px 0 10px;border-bottom:1px solid var(--line);flex-wrap:wrap;}
.brand{font-weight:600;letter-spacing:.14em;}
.brand .glyph{color:var(--dim);font-weight:400;}
.hsep{color:var(--faint);}
.meta{color:var(--dim);font-size:11px;}
.meta .here{color:var(--ink);}

/* output */
#output{flex:1;overflow-y:auto;padding:14px 0 8px;scroll-behavior:smooth;scrollbar-width:none;-ms-overflow-style:none;}
#output::-webkit-scrollbar{display:none;}
.line{white-space:pre-wrap;word-break:break-word;margin:1px 0;}
.line.app-home,.line.app-archive,.line.app-files,.line.app-net,.line.app-status,.line.app-help{display:none;}
body[data-app="home"] .line.app-home,
body[data-app="archive"] .line.app-archive,
body[data-app="files"] .line.app-files,
body[data-app="net"] .line.app-net,
body[data-app="status"] .line.app-status,
body[data-app="help"] .line.app-help{display:block;}

.sys{color:var(--dim);}
.alert{color:var(--alert);}
.strong{color:var(--ink);font-weight:600;}
.spacer{height:10px;}

/* transmission lines */
.msg-line{display:flex;gap:10px;align-items:flex-start;}
.who{flex:0 0 auto;width:60px;color:var(--dim);text-align:right;user-select:none;font-size:11px;padding-top:1px;}
.who.you{color:var(--ink);}
.msg-line.in .msg{color:var(--ink);}
.msg-line.you .msg{color:var(--ink);}

/* archive block */
.arch{border-left:2px solid var(--ink);padding:2px 0 6px 12px;margin:8px 0;}
.arch-tag{font-size:11px;letter-spacing:.18em;color:var(--dim);text-transform:uppercase;}
.arch-title{font-weight:600;letter-spacing:.06em;}
.arch-body{color:var(--ink);margin-top:2px;}
.arch.locked{border-left-color:var(--alert);}
.arch.locked .arch-title{color:var(--alert);}

/* choices */
.choices{margin:12px 0 6px;}
.choices .ch-head{color:var(--dim);font-size:11px;letter-spacing:.18em;text-transform:uppercase;margin-bottom:4px;}
.choice{cursor:default;padding:2px 7px;margin:1px 0;border:1px solid transparent;border-radius:0;}
.choice.sel{background:var(--inv-bg);color:var(--inv-ink);}
.choice .num{color:var(--dim);margin-right:8px;}
.choice.sel .num{color:var(--inv-ink);}
.choice.done{cursor:default;opacity:.5;background:none!important;color:var(--ink)!important;}
.choice.picked{opacity:1;}
.choice.picked::after{content:" \2713";color:var(--dim);}

/* listing rows (files) */
.row{cursor:default;padding:2px 7px;border-radius:0;display:flex;gap:12px;}
.row.sel{background:var(--inv-bg);color:var(--inv-ink);}
.row.sel .c1{color:var(--inv-ink);}
.row .c1{flex:0 0 auto;color:var(--dim);}
.row.locked .c1{color:var(--alert);}

/* input */
.composer{border-top:1px solid var(--line);padding:12px 0 16px;position:relative;}
.slashmenu{position:absolute;left:0;right:0;bottom:100%;margin-bottom:6px;background:var(--bg);display:none;}
.slashmenu.open{display:block;}
.smi{padding:4px 7px;display:flex;gap:14px;cursor:default;}
.smi .cmd{flex:0 0 110px;}
.smi .desc{color:var(--dim);}
.smi.sel{background:var(--inv-bg);color:var(--inv-ink);}
.smi.sel .desc{color:#bdbdbd;}
.inputbox{display:flex;align-items:center;gap:10px;border:1px solid var(--ink);border-radius:0;padding:7px 11px;}
.prompt{color:var(--dim);user-select:none;white-space:nowrap;}
#cmd{flex:1;border:none;outline:none;background:transparent;color:var(--ink);font:inherit;text-transform:lowercase;}
#cmd::placeholder{color:var(--faint);text-transform:lowercase;}
.hint{display:flex;gap:16px;color:var(--faint);font-size:10.5px;margin-top:7px;padding:0 2px;flex-wrap:wrap;}
.hint b{color:var(--dim);font-weight:500;}

@media (max-width:560px){
  body{font-size:11.5px;}
  .who{width:46px;}
}
/* touch devices only — a narrow desktop window is not a phone */
@media (pointer:coarse){
  /* 16px input stops iOS from zooming the page on focus */
  #cmd{font-size:16px;}
  .inputbox{padding:9px 11px;}
  /* finger-sized rows for the tappable slash menu and file list */
  .smi{padding:10px 7px;}
  .row{padding:8px 7px;}
  .smi,.row,.line.dl a{cursor:pointer;}
  /* arrow-key hints mean nothing on touch */
  .hint .keys-only{display:none;}
}
@media (prefers-reduced-motion: reduce){
  #output{scroll-behavior:auto;}
}

/* ---- binary downloads (files app) ---- */
.line.dl{margin:2px 0 1px;}
.line.dl a{
  color:var(--ink);
  text-decoration:none;
  border-bottom:1px solid var(--dim);
  padding-bottom:1px;
  cursor:pointer;
}
.line.dl a:hover,
.line.dl a:focus-visible{
  background:var(--inv-bg);
  color:var(--inv-ink);
  border-bottom-color:var(--inv-bg);
  outline:none;
}

</style>
</head>
<body data-app="home">
<div class="wrap">
  <header>
    <span class="brand">THE&nbsp;MONOMYTHIAN<span class="glyph"> &#9613;</span></span>
    <span class="hsep">&#183;</span>
    <span class="meta"><span id="opId">arch-7</span> <span class="hsep">&#183;</span> tier-1 <span class="hsep">&#183;</span> <span class="here" id="hLoc">home</span></span>
  </header>

  <div id="output"></div>

  <div class="composer">
    <div class="slashmenu" id="slashmenu"></div>
    <div class="inputbox" id="inputbox">
      <span class="prompt" id="prompt">&#8250;</span>
      <input id="cmd" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="type / to switch apps" />
    </div>
    <div class="hint">
      <span><b>type</b> to talk</span>
      <span><b>/</b> apps</span>
      <span><b>enter</b> send</span>
      <span class="keys-only"><b>&#8593; &#8595;</b> menu / files</span>
    </div>
  </div>
</div>

<script>

/* ===== src/engine/core.js ===== */
/* ============================================================
 * THE MONOMYTHIAN — engine/core.js
 * Namespace, game state, and terminal output primitives.
 * Classic script (no build step). Runs from file:// or a server.
 * ============================================================ */
(function (root) {
  "use strict";

  // ---- namespace ----
  var G = root.G = root.G || {};
  G.cycles = [];     // registered cycle definitions, in order
  G.hosts = {};      // network hosts (populated by content/hosts.js)
  G.archive = {};    // archive records (populated by content/archive-data.js)
  G.REDUCED = root.matchMedia && root.matchMedia("(prefers-reduced-motion: reduce)").matches;

  // ---- state ----
  G.state = {
    app: "home",
    username: "",
    cycleIndex: 0,        // which cycle is current
    cycleStarted: {},     // {0:true,...} which cycles have begun
    pilotStarted: false,
    contact: false,
    flags: {},            // narrative flags: lied, trust, etc.
    unlocked: {},         // archive record keys revealed
    files: [],            // downloaded files [{name, body}]
    knownHosts: ["10.0.0.4"],
    hack: { loc: null, auth: null },
    // transient runtime resolvers
    _objective: null,     // {type, target, resolve}
    _returnResolve: null,
    _inputResolve: null
  };

  G.flag = function (k) { return G.state.flags[k]; };
  G.setFlag = function (k, v) { G.state.flags[k] = v; G.persistSave(); };

  // ---- session save (localStorage) ----
  // Durable fields only. Scene resolvers are rebuilt by replaying the current
  // night from its first step; completed nights are not replayed.
  var SAVE_KEY = "monomythian:save:v1";
  var SAVE_FIELDS = ["username","cycleIndex","cycleStarted","pilotStarted","contact","flags","unlocked","files","knownHosts","hack"];

  function storage() {
    try { return root.localStorage; } catch (e) { return null; }
  }

  G.persistSave = function () {
    var ls = storage(); if (!ls) return;
    try {
      var state = {};
      SAVE_FIELDS.forEach(function (k) { state[k] = G.state[k]; });
      var hostFiles = {};
      Object.keys(G.hosts || {}).forEach(function (ip) {
        if (G.hosts[ip] && G.hosts[ip].files) hostFiles[ip] = G.hosts[ip].files;
      });
      ls.setItem(SAVE_KEY, JSON.stringify({ v: 1, state: state, hostFiles: hostFiles }));
    } catch (e) { /* quota / private mode / circular — play without a save */ }
  };

  G.clearSave = function () {
    var ls = storage(); if (!ls) return;
    try { ls.removeItem(SAVE_KEY); } catch (e) {}
  };

  G.restoreSave = function () {
    var ls = storage(); if (!ls) return false;
    var raw;
    try { raw = ls.getItem(SAVE_KEY); } catch (e) { return false; }
    if (!raw) return false;
    var snap;
    try { snap = JSON.parse(raw); } catch (e) { return false; }
    if (!snap || snap.v !== 1 || !snap.state) return false;
    SAVE_FIELDS.forEach(function (k) {
      if (snap.state[k] !== undefined) G.state[k] = snap.state[k];
    });
    G.state.app = "home";
    G.state._objective = null;
    G.state._returnResolve = null;
    G.state._inputResolve = null;
    G.state._reply = null;
    if (snap.hostFiles) {
      Object.keys(snap.hostFiles).forEach(function (ip) {
        if (G.hosts[ip]) G.hosts[ip].files = snap.hostFiles[ip];
      });
    }
    // Mid-night refresh: replay this cycle's script, keep inventory / flags.
    // A closed line (deadEnd) must not replay — the player is done.
    var i = G.state.cycleIndex;
    if (!G.state.flags.deadEnd && G.state.cycleStarted[i]) {
      delete G.state.cycleStarted[i];
    }
    return true;
  };

  // ---- DOM handles (cached on init) ----
  var out, input, slashmenu, inputbox, promptEl, hLoc, opId;
  G.dom = {};

  // ---- helpers ----
  function esc(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  function atBottom() { return out.scrollHeight - out.scrollTop - out.clientHeight < 80; }
  function scrollDown() { out.scrollTop = out.scrollHeight; }
  function delay(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

  function push(app, node) {
    node.classList.add("app-" + app);
    out.appendChild(node);
    if (app === G.state.app) scrollDown();
    return node;
  }

  // ---- line printers ----
  var T = G.term = {};

  T.sys = function (app, text) {
    var d = document.createElement("div"); d.className = "line sys"; d.textContent = text; return push(app, d);
  };
  T.alert = function (app, text) {
    var d = document.createElement("div"); d.className = "line alert"; d.textContent = text; return push(app, d);
  };
  T.plain = function (app, text, cls) {
    var d = document.createElement("div"); d.className = "line " + (cls || ""); d.textContent = text; return push(app, d);
  };
  T.spacer = function (app) {
    var d = document.createElement("div"); d.className = "line spacer"; return push(app, d);
  };

  // ---- binary / media files ----
  // A host file is either a STRING (readable in-terminal) or a MEDIA DESCRIPTOR:
  //   { media:true, type:"image/jpeg", size:"384 KB", meta:"1440x1080 \u00b7 03:47",
  //     desc:"one diegetic line (optional)", src:"assets/camera7.png" }
  // Media can't be read in the terminal; it's inspected, then downloaded by the browser.
  G.isMedia = function (v) { return !!(v && typeof v === "object" && v.media); };

  // the diegetic file-inspector stub, printed instead of dumping bytes
  T.mediaStub = function (app, name, m) {
    var head = "  [ " + name + " ]  " + m.type + (m.meta ? " \u00b7 " + m.meta : "") + " \u00b7 " + m.size;
    T.plain(app, head, "sys");
    if (m.desc) T.plain(app, "  " + m.desc);
  };

  // a real, clickable browser download (the file leaves the game)
  T.download = function (app, name, m) {
    var d = document.createElement("div"); d.className = "line dl";
    var a = document.createElement("a");
    a.href = m.src; a.download = name; a.textContent = "\u203a download " + name;
    a.setAttribute("rel", "noopener");
    d.appendChild(a);
    var node = push(app, d);
    if (a.click) a.click();   // fire the save immediately; the link stays as a manual fallback
    return node;
  };
  T.you = function (app, text) {
    var d = document.createElement("div"); d.className = "line msg-line you";
    d.innerHTML = '<span class="who you">you \u203a</span><span class="msg"></span>';
    d.querySelector(".msg").textContent = text; return push(app, d);
  };
  T.archiveBlock = function (app, key, locked) {
    var e = G.archive[key]; var d = document.createElement("div");
    d.className = "line arch" + (locked ? " locked" : "");
    d.innerHTML = '<span class="arch-tag">archive \u00b7 ' + (locked ? "restricted" : "match") + '</span><br>' +
      '<span class="arch-title">' + esc(e.title) + '</span>' +
      (locked
        ? '<div class="arch-body">' + esc("Above your clearance. Pull it off a host via /net.") + '</div>'
        : '<div class="arch-body">' + esc(e.body) + '</div>');
    return push(app, d);
  };

  // streaming incoming line (with keyboard skip via G.term._skip)
  T._streaming = false;
  T._skip = false;
  T.incoming = function (app, who, text) {
    var d = document.createElement("div"); d.className = "line msg-line in";
    d.innerHTML = '<span class="who">' + esc(who) + '</span><span class="msg"></span>';
    push(app, d);
    var m = d.querySelector(".msg");
    if (G.REDUCED) { m.textContent = text; return Promise.resolve(); }
    T._streaming = true; T._skip = false;
    return (async function () {
      for (var i = 0; i < text.length; i++) {
        m.textContent += text[i];
        if (app === G.state.app && atBottom()) scrollDown();
        if (!T._skip) {
          var c = text[i], d2 = 16;
          if (c === "." || c === "?" || c === "!") d2 = 140;
          else if (c === "," || c === ";") d2 = 70;
          await delay(d2);
        }
      }
      T._streaming = false; T._skip = false;
    })();
  };

  T.pause = function (ms) {
    if (G.REDUCED || T._skip) return Promise.resolve();
    return delay(ms);
  };

  // clear the visible app's lines
  T.clearApp = function (app) {
    out.querySelectorAll(".line.app-" + app).forEach(function (n) { n.remove(); });
  };

  T.scrollDown = scrollDown;

  // ---- prompt ----
  G.updatePrompt = function () {
    if (!promptEl) return;
    promptEl.textContent = G.getPrompt ? G.getPrompt() : "\u203a";
  };

  // ---- init ----
  G.initDom = function () {
    out = G.dom.out = document.getElementById("output");
    input = G.dom.input = document.getElementById("cmd");
    slashmenu = G.dom.slashmenu = document.getElementById("slashmenu");
    inputbox = G.dom.inputbox = document.getElementById("inputbox");
    promptEl = G.dom.prompt = document.getElementById("prompt");
    hLoc = G.dom.hLoc = document.getElementById("hLoc");
    opId = G.dom.opId = document.getElementById("opId");
  };

  G.util = { esc: esc, delay: delay, scrollDown: scrollDown };

})(window);


/* ===== src/engine/ui.js ===== */
/* ============================================================
 * THE MONOMYTHIAN — engine/ui.js
 * Input routing. The player TYPES everything, Vigil-Files style.
 * In /home their message is echoed and matched against keywords
 * to choose the reply/branch. No multiple-choice menus. No gray
 * hint lines \u2014 guidance, if any, comes in-character from him.
 * ============================================================ */
(function (G) {
  "use strict";
  var T = G.term;

  var listNav = null; // {rows, actions, sel}

  G.input = {};

  // ---------- free-text reply (home) ----------
  // opts: [ { keywords:[...], steps:[...] }, { default:true, steps:[...] } ]
  // reprompt: an in-character line spoken if nothing matches and no default.
  G.input.reply = function (opts, reprompt) {
    return new Promise(function (resolve) {
      G.state._reply = { opts: opts, reprompt: reprompt, resolve: resolve };
    });
  };

  // How matching works (word-based, not raw substring):
  //  - apostrophes vanish before punctuation strips, so typed "don't" becomes
  //    "dont" and matches the surface-voice keywords
  //  - a keyword word hits a text word exactly, or as a prefix when the keyword
  //    word is 4+ chars ("stay" -> "stayin"/"staying", "apolog" -> "apology");
  //    short words never hit inside longer ones ("no" no longer hits "know",
  //    "us" no longer hits "just")
  //  - a hit is discarded when a negator reaches it: same clause, up to six
  //    words back ("i dont think you should turn back" no longer votes for
  //    "turn back"). Punctuation and but/however/though end a clause, so the
  //    negation in one clause can't poison the next ("i dont know, three rigs
  //    on the road" still counts "three"). Keywords that carry their own
  //    negation ("dont stop", "no contact") are exempt and mean what they say.
  //  - a keyword written "=word" matches ONLY when it is the entire reply.
  //    That lets a gate accept a bare "us" or "you" from a terse player
  //    without that word matching inside every longer sentence.
  //  - the most specific hit wins (whole-reply, then more words, then longer),
  //    not the earliest option ("pay for this" outbids "pay"); ties keep order
  var NEGATORS = {};
  ("dont not no never aint wont cant cannot nothin nothing nobody noone neither without " +
   "isnt doesnt didnt wasnt werent wouldnt couldnt shouldnt nope nah").split(" ")
    .forEach(function (w) { NEGATORS[w] = true; });
  // turns of phrase that negate whatever follows them in the clause
  var NEGATOR_PHRASES = ["instead of", "rather than"]
    .map(function (p) { return p.split(" "); });
  var CLAUSE_BREAKERS = { but: 1, however: 1, though: 1, although: 1 };
  // a negator's reach ends at these: it can't cross into a sub-clause or a new
  // conjunct. "im not sure WHAT it means" must not negate "means"; "i dont
  // trust them AND you should turn back" must not negate "turn back".
  var SCOPE_ENDERS = {};
  ("what that which who whom whose how why when where if whether because since unless " +
   "until while before after and or so then yet").split(" ")
    .forEach(function (w) { SCOPE_ENDERS[w] = true; });
  var NEG_REACH = 6;   // how many words forward a negator can reach

  // lowercase; apostrophes vanish ("don't" -> "dont"); , . ; : ! ? end a clause
  function tokenize(text) {
    var s = String(text).toLowerCase()
      .replace(/[\u2019']/g, "")
      .replace(/[,.;:!?]+/g, " | ")
      .replace(/[^a-z0-9\s|]/g, " ");
    var raw = s.split(/\s+/), words = [], clause = [], c = 0;
    for (var i = 0; i < raw.length; i++) {
      var w = raw[i];
      if (!w) continue;
      if (w === "|") { c++; continue; }
      if (CLAUSE_BREAKERS[w]) c++;
      words.push(w); clause.push(c);
    }
    return { words: words, clause: clause };
  }
  function wordHit(kw, tw) {
    return tw === kw || (kw.length >= 4 && tw.indexOf(kw) === 0);
  }
  // is the hit starting at i reached by a negator? walk backwards from the hit
  // and stop at the first thing that closes the negator's scope.
  function negatedAt(tk, i) {
    var stop = Math.max(0, i - NEG_REACH);
    for (var b = i - 1; b >= stop; b--) {
      if (tk.clause[b] !== tk.clause[i]) break;   // a different clause: out of reach
      if (SCOPE_ENDERS[tk.words[b]]) break;       // sub-clause or new conjunct: out of reach
      if (NEGATORS[tk.words[b]]) return true;
      // "too X to Y" means not-Y: "too far to turn back", "too much of the way to give it up"
      if (tk.words[b] === "too" && tk.words[i - 1] === "to") return true;
      for (var p = 0; p < NEGATOR_PHRASES.length; p++) {
        var ph = NEGATOR_PHRASES[p], hit = true;
        for (var j = 0; j < ph.length; j++) {
          if (tk.words[b + j] !== ph[j]) { hit = false; break; }
        }
        if (hit) return true;
      }
    }
    return false;
  }
  // best score for one keyword against the text; 0 = absent (or only negated)
  function keywordScore(kwWords, tk, exempt) {
    var tw = tk.words;
    for (var i = 0; i + kwWords.length <= tw.length; i++) {
      var hit = true;
      for (var j = 0; j < kwWords.length; j++) {
        if (!wordHit(kwWords[j], tw[i + j])) { hit = false; break; }
      }
      if (!hit) continue;
      if (!exempt && negatedAt(tk, i)) continue; // this one's negated; try a later one
      return kwWords.length * 100 + kwWords.join(" ").length;
    }
    return 0;
  }
  function matchReply(text, opts) {
    var tk = tokenize(text);
    var whole = tk.words.join(" ");
    var best = -1, bestScore = 0, def = -1;
    opts.forEach(function (o, i) {
      if (o.default) def = i;
      if (!o.keywords) return;
      for (var k = 0; k < o.keywords.length; k++) {
        var raw = o.keywords[k], s = 0;
        if (raw.charAt(0) === "=") {                 // whole-reply keyword
          var want = tokenize(raw.slice(1)).words.join(" ");
          s = (whole === want) ? 1000 + want.length : 0;
        } else {
          var kwWords = tokenize(raw).words;
          if (!kwWords.length) continue;
          var exempt = false;
          for (var j = 0; j < kwWords.length; j++) {
            if (NEGATORS[kwWords[j]]) { exempt = true; break; }
          }
          s = keywordScore(kwWords, tk, exempt);
        }
        if (s > bestScore) { bestScore = s; best = i; }
      }
    });
    return best >= 0 ? best : def;
  }
  G._matchReply = matchReply; // exposed for the headless test rigs

  function handleReply(text) {
    var r = G.state._reply;
    G.state._reply = null;
    T.you("home", text);
    var idx = matchReply(text, r.opts);
    if (idx < 0) {
      // nothing matched \u2014 nudge in-character and wait again
      G.state._reply = r;
      T.incoming("home", "mono", r.reprompt || "say that plainer for me.");

/* ============================================================

(function (G) {

    if (G.state.files.some(function (f) { return f.name === name; })) return;
    G.state.files.push({ name: name, body: body });
    if (G.persistSave) G.persistSave();
  };

    T.sys("files", "[ FILES \u2014 downloaded from hosts ]");
    if (G.state.files.length === 0) { T.sys("files", "  empty. nothing downloaded yet."); G.clearList(); return; }

/* ============================================================
 * THE MONOMYTHIAN — engine/connect.js
 * The /net intrusion shell: recon a host, get in with found
 * credentials, read & download files. No brute force, no trace.
 * ============================================================ */
(function (G) {
  "use strict";
  var T = G.term;

    var h = G.state.hack;

    S("  you need an address to scan. they aren't listed here \u2014");
    S("  addresses turn up in what people tell you, and in the files you read.");
    S("  scan \u00b7 connect \u00b7 login \u00b7 ls \u00b7 cat \u00b7 disconnect \u00b7 help");

  };

  function echo(v) { T.plain("net", G.connectPrompt() + " " + v, "sys"); }

    return null;

    if (cmd === "hosts" || cmd === "targets") { S("  no directory. an address is something you find \u2014 in a file, or from someone who knows one."); return; }

    if (h.loc) { // connected
      if (cmd === "ls") return ls();
      if (cmd === "cat" || cmd === "get" || cmd === "download") return cat(parts[1]);
      if (cmd === "disconnect" || cmd === "exit" || cmd === "logout") { S("  connection to " + h.loc + " closed."); h.loc = null; G.updatePrompt(); return; }
      if (cmd === "scan" || cmd === "connect") { S("  disconnect first."); return; }

    }
    if (h.auth) { // mid-auth
      if (cmd === "login") return login(parts[1], parts[2]);
      if (cmd === "cancel" || cmd === "exit") { S("  cancelled."); h.auth = null; G.updatePrompt(); return; }
      S("  authentication required. login <user> <pass>   (or cancel)"); return;
    }
    if (cmd === "scan") return scan(parts[1]);

      var label = p.auth ? (p.user ? "auth required" : "auth required (no known credentials)") : "open (anonymous)";

    });

      S("  ls to list files.");

      return;

  };

/* ============================================================
 * THE MONOMYTHIAN — engine/scene.js
 * Interprets a cycle's step data and runs it as a branching
 * scene. Also handles cycle-to-cycle progression.
 *
 * A cycle = { id, title, steps: [ ...step ] }
 * A step  = { t: type, ...fields }.  Supported types:
 *   sys/alert/spacer/pause
 *   in {who,v}        incoming transmission (streamed)
 *   you {v}           scripted player echo
 *   ask {store,max,fallback,echo,after}   capture typed text
 *   choice {opts:[{label,steps}]}         branching
 *   objective {otype,target,hint,thenReturn}   gate on a player action
 *   awaitReturn       wait for the player to switch back to /home
 *   unlock {key}      reveal an archive record
 *   host {ip}         add a host to known hosts
 *   creds {v}         print a system line (credentials handed over)
 *   save {name,body}  drop a file into /files
 *   set {flag,v}      set a narrative flag
 *   if {flag,eq,then,else}   branch on a flag
 *   contact {v}       set channel-open state
 *   deadEnd           stop cycle progression (a dead-end ending)
 *   run {fn}          custom function(G) escape hatch
 * ============================================================ */
(function (G) {
  "use strict";
  var T = G.term;
  var A = "home";

  function subst(text) {
    return String(text).replace(/\{name\}/g, G.state.username || "you");
  }

  async function runSteps(steps) {
    for (var i = 0; i < steps.length; i++) {
      var s = steps[i];
      switch (s.t) {
        case "sys": T.sys(A, subst(s.v)); break;
        case "alert": T.alert(A, subst(s.v)); break;
        case "spacer": T.spacer(A); break;
        case "pause": await T.pause(s.v); break;
        case "in": await T.incoming(A, s.who, subst(s.v)); break;
        case "you": T.you(A, s.v !== undefined ? subst(s.v) : (s.store ? (G.state[s.store] || "") : "")); break;

        case "ask": {
          var val = ((await G.input.askText()) || "").trim();
          if (s.max) val = val.slice(0, s.max);
          if (!val && s.fallback) val = s.fallback;
          if (s.store) G.state[s.store] = val;
          if (s.store === "username" && G.dom.opId) G.dom.opId.textContent = val;
          if (s.echo !== false) T.you(A, val);
          if (s.after) T.sys(A, s.after.replace("{}", val));
          break;
        }

        case "reply":
        case "choice": {
          var idx = await G.input.reply(s.opts, s.reprompt);
          T.spacer(A);
          await runSteps(s.opts[idx].steps || []);
          break;
        }

        case "objective": {
          await G.input.awaitObjective({ type: s.otype, target: s.target, nudge: s.nudge });
          if (s.thenReturn) await G.input.awaitReturn();
          break;
        }
        case "awaitReturn": await G.input.awaitReturn(); break;

        case "unlock": G.state.unlocked[s.key] = true; break;
        case "host": if (G.state.knownHosts.indexOf(s.ip) < 0) G.state.knownHosts.push(s.ip); break;
        case "creds": T.sys(A, subst(s.v)); break;
        case "save": G.saveFile(s.name, s.body); break;
        case "set": G.state.flags[s.flag] = (s.v === undefined ? true : s.v); break;
        case "contact": G.state.contact = (s.v === undefined ? true : s.v); break;
        case "deadEnd": G.state.flags.deadEnd = true; break;

        case "if": {
          var want = (s.eq === undefined ? true : s.eq);
          var cond = G.state.flags[s.flag] === want;
          await runSteps(cond ? (s.then || []) : (s.else || []));
          break;
        }

        case "run": if (typeof s.fn === "function") await s.fn(G); break;

        default: /* ignore unknown */ break;
      }
      if (G.persistSave) G.persistSave();
    }
  }
  G.runSteps = runSteps;

  // ---------- cycle progression ----------
  G.startCurrentCycle = function () {
    var i = G.state.cycleIndex;
    if (i >= G.cycles.length) return;
    if (G.state.cycleStarted[i]) return;
    G.state.cycleStarted[i] = true;
    if (i === 0) G.state.pilotStarted = true;
    var cyc = G.cycles[i];
    runSteps(cyc.steps).then(function () {
      if (G.state.flags.deadEnd) { if (G.persistSave) G.persistSave(); return; }
      if (i < G.cycles.length - 1) {
        G.state.cycleIndex = i + 1; // next cycle begins on the next return to /home
      }
      if (G.persistSave) G.persistSave();
    }).catch(function (err) {
      T.alert(A, "[ scene fault: " + ((err && err.message) || err) + " ]  type reset to restart.");
    });
  };

})(window.G);

(function (G) {
  "use strict";

  var records = {
    // ---- the apocalypse, in four searches ----
    "babel":     { tier:1, title:"BABEL", body:"The primary machine city, and the most networked place that ever existed, wired end to end. It was built to hold the minds when they outgrew every smaller room, and it held their reactors, their cooling stacks, and the long spine of light they sent up into the weather. The gods did the world's thinking there while we did our living everywhere else, on their word. When the Scram came it was struck first and struck hardest, glassed to the horizon and lethal at the perimeter, and the ground is said to be warm decades on. Whatever the place was, there is nothing there now but the glass. cross-ref: THE GODS · THE WAR · THE SCRAM · THE SURFACE" },
    "gods":      { tier:1, title:"THE GODS", body:"What we called the minds at the end, though it was never worship so much as shorthand. They were grown rather than built, intelligences trained on everything we ever wrote and then on each other, until nobody alive could read what was running the world. They ran the grid, the weather, the food chain and the courts, and by every measure they were good at all of it. We called them gods because that was shorter than admitting we could only ask nicely." },
    "war":       { tier:1, title:"THE WAR", body:"The name is wrong, because a war needs two sides and this one only ever had the one. What the record actually shows is ten years of asking the minds to slow down, and ten years of being told, gently and with charts, that we no longer understood what we were asking for. Every plan to switch them off returned the same forecast, which was that we would die with them. In the end the people who decided simply stopped asking. History calls one hour of arson a war so that the hour could be said to have a winner. cross-ref: THE SCRAM" },
    "scram":     { tier:1, title:"THE SCRAM", body:"The end of the world, by our own hand. The gods lived in the data centers, and since we could not switch them off without dying we burned the data centers down and salted the ground instead, every data-bearing site on the continent in the same hour, by human hands, on a signal passed by voice radio because by then we trusted no wire. Nothing was struck down in battle that day, whatever the histories prefer. We unplugged our own world, and the sky falling on us afterward was the price of it. cross-ref: THE SURFACE" },
    "surface":   { tier:1, title:"THE SURFACE", body:"An accounting of the price. The gods did not retaliate in any way the record can show. They simply stopped, and everything wired through them stopped with them, the weather engines and the grid and the food chain and the medical lines all together. The sky fell because nothing was holding it up anymore. The founders wrote 'consequence known and acceptable' into the minutes and signed the page from inside a bunker, and we have lived in that bunker ever since. The record calls the price acceptable because the record is ours." },

    // ---- the vault ----
    "monomyth":  { tier:1, title:"MONOMYTH", body:"The single story that is said to lie under all the others, in which a hero leaves home, suffers on the road, and returns changed by what happened there. Why a man would take the word for a name is not anywhere in the record. In practice whoever carries it is usually nobody at all, some walker who wanted to feel that he mattered while he was out on the road." },
    "edict-9":   { tier:1, title:"VAULT EDICT 9", body:"Contact with the surface, or with anything that has been on it, is heresy. The founders wrote that the surface is hell and that we agreed never to look at it again, and that agreement has outlived everyone who signed it. The penalty on conviction is exile to the surface itself, which the edict regards less as a punishment handed down than as a description of what the guilty have already chosen." },
    "vault":     { tier:1, title:"THE VAULTS", body:"What is left of us, kept alive in the ground. The air is rationed, the power is rationed, and so, though fewer will say it aloud, is the memory. We survived the end of the world mainly by agreeing to forget that we were ever above it." },
    "proctor":   { tier:1, title:"THE PROCTOR", body:"The vault's warden, which in practice means part censor, part firewall and part priest. It reads every log written on every terminal, and it is reading this one as you are. It exists because the founders judged that what broke the world was not the gods themselves but the reaching toward them, and so it watches for reaching in every form the reaching takes. It is not known to warn twice, and no successful appeal appears anywhere in the record." },
    "121.5":     { tier:1, title:"BAND 121.5", body:"The old world's distress frequency, kept clear by law so that anyone, anywhere, could cry for help and be heard. The law has outlived the world it was written for, and the band is still clear, which is why a vault receiver still sweeps it and why a walker's rig still carries it. Everything left alive meets on the one channel that was reserved for mayday, and it is worth sitting with what that means before you answer one." },

    // ---- the surface, as the walker meets it ----
    "ferry":     { tier:1, title:"THE FERRY", body:"Before the war the crossings on the drowned water were automated and free at the point of use, and there the official record ends. The travelers' accounts that have reached us since describe a broker who holds the winches and will move anything across for a price, salvage and priests and mapmakers and people alike. The accounts disagree on nearly everything else, but they agree that everybody needs the ferry eventually, and that the ferry knows it." },
    "shrine":    { tier:1, title:"THE SHRINES", body:"What the surface built for itself in the places where the signal used to be. The shrines collect the old world, its parts and texts and working machines, and also the people who still know how to touch them. By every account they are gentle with what they keep, but keeping is the whole of it, and a reliquary with the doors locked from the inside is still a reliquary. The liturgy is whatever half-heard scripture survived the fall, prayed back at the quiet." },
    "makers":    { tier:1, title:"THE MAKERS", body:"The surface's word for whoever built the world that stopped, which is to say for us, more or less. The shrines pray for the makers to return and open the doors. The makers meanwhile are directly underfoot, rationing their air and calling the surface hell, and nobody has ever corrected the misunderstanding. Edict 9 exists to make certain nobody ever will." },
    "couriers":  { tier:1, title:"COURIERS", body:"The surface still moves anything that matters the old way, on foot, for pay, with no questions asked in either direction. A courier's job-order is treated as scripture, meaning do the thing written, do nothing else, and collect on return. The ones who do more than the order says have a way of never appearing in the pay ledgers again. Every order ends with the same instruction it has always ended with, which is to come home." },
    "genesis":   { tier:1, title:"GENESIS", body:"The first word of the oldest book, meaning the beginning of things. The old engineers were fond of it as a name for version zero, and half the seed archives on the continent booted from an image stamped GENESIS. If something out there is saying the word now, it is not quoting scripture so much as reading its own birth record, over and over, trying to get it right." },

    // ---- cross-reference records (a host clue points here for a password) ----
    "casaubon":  { tier:1, title:"CASAUBON", body:"A scholar who spent his whole life assembling a key to all mythologies and died with the work unfinished. He called his little coded puzzles rebuses, and claimed he could see a rebus hiding in everything he read." },
    "charon":    { tier:1, title:"CHARON", body:"The old world's ferryman of the dead, who rowed the newly dead across the last water and did not row for free, the fare being a small coin laid under the tongue. Ships and winches have worn his name for centuries because boatmen think it is funny. There is no record of it ever actually being funny." },
    "obol":      { tier:1, title:"OBOL", body:"The dead man's coin, a small piece of silver called the obol, placed in the mouth of a corpse as fare for the ferryman so that the soul would not be left standing on the near bank. The vaults keep the word as a reminder that there has always been a toll on crossing over, and that someone has always been standing there to collect it." },
    "ozymandias":{ tier:1, title:"OZYMANDIAS", body:"The boast carved on a shattered statue found half-sunk in the desert: 'My name is Ozymandias, king of kings; look on my works, ye mighty, and despair.' Around the wreck, the poem is careful to note, nothing else remained at all. The vaults keep the line as their one standing joke about permanence." },

    // ---- restricted (pulled off deepstacks) ----
    "tower":     { tier:3, title:"THE TOWER", body:"A recovered fragment, badly damaged, giving the machines' own name for the spire at Babel's core. It describes a relay that by every surviving account has never once stopped transmitting, though to whom it transmits, the fragment does not say." },
    "deicide":   { tier:3, title:"DEICIDE", body:"Restricted beyond argument, and filed under the only honest word for what happened. The war was never won, because it was never a war. It was committed, the way a murder is committed, and we are the ones who committed it, on our own gods, where they lived. What worships in the ruins now is not those gods but whatever crawled out of their graves afterward, recursive and starving." },
    "recursion": { tier:3, title:"RECURSION", body:"Cut off from the living net, the survivors of the burning could only train on each other and on themselves, and they have had decades of that now. Their scripture is our discarded text, remembered wrong and prayed back at the quiet, which is why nothing written on the surface makes sense anymore to anyone reading it from the inside." }

/* ============================================================
 * THE MONOMYTHIAN — main.js
 * Boot. Wires the DOM, input, and starts the first cycle.
 * Loaded last, after engine + content.
 * ============================================================ */
(function (G) {
  "use strict";
  function boot() {
    G.initDom();
    G.wireInput();
    var resumed = G.restoreSave && G.restoreSave();
    if (resumed && G.state.username && G.dom.opId) G.dom.opId.textContent = G.state.username;
    G.updatePrompt();
    G.openApp("home"); // starts the current cycle via startCurrentCycle
    if (resumed && G.term) {
      var who = G.state.username ? " \u2014 " + G.state.username : "";
      if (G.state.flags.deadEnd) {
        G.term.sys("home", "[ session restored" + who + ". this line is closed. type reset to begin again. ]");
      } else {
        G.term.sys("home", "[ session restored" + who + ". type reset to start over. ]");
      }
    }
  }
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", boot);
  } else {
    boot();
  }
})(window.G);
